name: Check shop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install uv
      - run: node tests/shop.test.cjs
      - run: uv run --locked pytest -q
      - if: runner.os == 'Linux'
        run: |
          uv export --locked --format requirements.txt --no-dev --no-emit-project --no-header --no-hashes --no-annotate --output-file requirements.txt
          git diff --exit-code -- requirements.txt
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: czuze-ci
      HOST_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 60
      - run: uv run --locked python tests/compose_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
